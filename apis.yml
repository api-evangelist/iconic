name: Iconic
description: 'Iconic (Iconic Interactive) is an AI gaming studio building real-time
  AI systems for video games and interactive storytelling — "Digital Actor" technology
  that lets game characters listen, react, and evolve alongside the player by combining
  speech recognition, large language models, and text-to-speech into low-latency conversational
  performances. Founded by veterans of GTA, Forza, Just Cause, and Sleeping Dogs with
  AI researchers from Cambridge and Imperial College, the company is backed by Northzone.
  Its flagship title, The Oversight Bureau, ships a demo on Steam. Iconic operates a
  marketing site, a Labs surface, and a technical blog; it does not currently publish
  a public developer API, OpenAPI, or SDKs. This profile was surfaced as a Northzone
  portfolio company and enriched by the API Evangelist pipeline.'
